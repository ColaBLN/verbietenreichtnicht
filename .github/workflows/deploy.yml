name: Website veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Nach web-service4u hochladen
    runs-on: ubuntu-latest

    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Per FTPS hochladen
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          # Der FTP-Benutzer startet bereits in /html/verbietenreichtnicht/,
          # deshalb wird relativ zu seinem Anmeldeverzeichnis hochgeladen.
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
